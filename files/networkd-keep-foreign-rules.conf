# Managed by Ansible (ovpn-gate role).
# systemd-networkd restarts (e.g. triggered by unattended upgrades) flush routing
# policy rules and routes it does not own. That deletes the
# "from <ovpn_external_gate_pool_network> lookup <ovpn_up_client_route_table>" rule
# added by vpn-obfs-up.sh, so external-TCP client traffic silently egresses via this
# gate's own uplink instead of the obfs4 peer. Keep foreign rules/routes intact.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
